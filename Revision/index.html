<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <center>
      <h1>Registration Forms</h1>
      <form action="about.html" method="get">
        <div>
          <input type="text" placeholder="Your name" />
        </div>
        <div>
          <input value="18" type="number" placeholder="Your age" />
        </div>
        <div>
          <input type="email" placeholder="your@mail.com" />
        </div>
        <div>
          <input type="password" placeholder="********" />
        </div>
        <div>
          <input type="tel" placeholder="tel" />
        </div>
        <div>
          <input type="color" placeholder="" />
        </div>
        <div>
          <input type="date" placeholder="" />
        </div>
        <div>
          <input type="range" min="1" max="20" />
        </div>
        <div>
          <input type="file" />
        </div>
        <div>
          <input type="radio" name="gender" />Male
          <input type="radio" name="gender" />Female
          <input type="radio" name="gender" />Other
        </div>
        <div>
          <input type="checkbox" />
          <input checked type="checkbox" />
          <input type="checkbox" />
          <input type="checkbox" />
          <input type="checkbox" />
        </div>
        <div>
          <select name="" id="">
            <option value="1">Surat</option>
            <option value="1">Ahemdabad</option>
            <option selected value="1">Baroda</option>
            <option value="1">Bharuch</option>
            <option value="1">Gandhinagar</option>
          </select>
        </div>
        <button type="submit">Submit</button>
      </form>
    </center>
  </body>
</html>
